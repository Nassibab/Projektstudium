version: '3.9'

services:
  api:
    build: ./services/api
    container_name: groupproject_api
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - neo4j
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: shitstorm_db
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ANALYSE_URL: http://analyse-py:8000
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    container_name: groupproject_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  mongodb:
    image: mongo:4.4
    container_name: groupproject_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: groupproject_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  ingestion:
    build: ./services/ingestion
    container_name: groupproject_ingestion
    ports:
      - "8001:8001"
    restart: unless-stopped

  analyse-py:
    build: ./services/analyse-py
    container_name: groupproject_analyse-py
    ports:
      - "8010:8000"
    environment:
      API_URL: http://api:8000
      ANALYSE_R_URL: http://analyse-r:8000
    restart: unless-stopped

  analyse-r:
    build: ./services/analyse-r
    container_name: groupproject_analyse-r
    ports:
      - "8020:8000"
    environment:
      API_URL: http://api:8000
      MODERATION_URL: http://moderation:8000
    restart: unless-stopped

  moderation:
    build: ./services/moderation
    container_name: groupproject_moderation
    ports:
      - "8030:8000"
    environment:
      API_URL: http://api:8000
    restart: unless-stopped

volumes:
  mongodb_data: {}
  neo4j_data: {}
