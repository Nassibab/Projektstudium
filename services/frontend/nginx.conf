server {
    listen 3000;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /evaluate-thread/ {
        proxy_pass http://moderation:8000;
        
        proxy_intercept_errors on;
        error_page 404 = @fallback;
    }

    location @fallback {
        root /usr/share/nginx/html;
        rewrite ^ /data.json break;
    }
}